[project]
name = "activation-space-explorer"
version = "0.1.0"
description = "Tools and experiments for exploring model activation spaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "packaging>=24.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
demo = [
    "gb10-load-llm>=0.1.2",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
