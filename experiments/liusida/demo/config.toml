[experiment]
core_version = "==0.1.0"

[model]
id = "Qwen/Qwen3-0.6B"
layer_index = 16
location = "model.model.layers.16"
device = "cuda"
dtype = "bfloat16"

[capture]
dataset = "Skylion007/openwebtext"
split = "train"
tokens = 1000000
context_length = 1024
model_batch_size = 8
shuffle_seed = 7
shuffle_buffer = 10000
activation_dtype = "float32"

[analysis]
n_clusters = 1000
normalize = false
pca_components = 3
minibatch_size = 8192
kmeans_max_iter = 10
random_state = 7

[target]
prompt = "Today is Friday."
token = " Friday"
